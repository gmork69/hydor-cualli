; Hydor-Cualli — Firmware embajador BASE (Firebase, sin historial)
; Placa: NodeMCU ESP8266. Un sensor a la vez por A0, jumper en D7.

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/mobizt/Firebase-ESP8266.git#v4.3.19
